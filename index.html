<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Răzuiește și câștigă</title>
<meta name="description" content="Răzuiește cardul, găsește 3 simboluri identice și ia bonusul.">
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="assets/img/favicon-32.png">
<link rel="apple-touch-icon" href="assets/img/icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Rubik:wght@600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/styles.css">
</head>
<body>

<main>

  <!-- ============================ HERO ============================ -->
  <section class="hero">
    <div class="hero__bg" aria-hidden="true"></div>

    <!-- Two separate lines, each carrying its own gradient — as in Figma, where the
         headline is two text nodes. A single element spanning two lines would stretch
         one gradient across both, leaving the second line entirely in the dark half.
         They sit inline on desktop, where the headline is one line. -->
    <h1 class="hero__title">
      <span class="hero__title-line" data-i18n="hero.title1">RĂZUIEȘTE ȘI</span>
      <span class="hero__title-line" data-i18n="hero.title2">CÂȘTIGĂ</span>
    </h1>

    <div class="hero__stage">
      <!-- Scratch card. The frame, the cream face and the three 100 LEI symbols are
           all baked into card-base.webp; card-cover.webp is the gold "?" panel the
           canvas paints on top and the pointer erases. Both share the same frame,
           so erasing over it reveals an identical frame underneath.
           The canvas is pointer-only — keyboard and screen-reader users reach the
           prize through the "auto scratch" button below, which runs the same flow. -->
      <div class="card">
        <canvas class="card__scratch" id="scratch" aria-hidden="true"></canvas>
        <!-- Sits over the card in the comp, so it comes after the canvas.
             Anchored to the card box, not the hero, because the card's rendered
             size matches the Figma frame on both breakpoints. -->
        <img class="deco-a" src="assets/img/symbol-a.webp" alt="" aria-hidden="true">
      </div>

      <p class="hero__hint" data-i18n="hero.hint">GĂSEȘTE 3 SIMBOLURI IDENTICE ȘI IA BONUSUL!</p>
    </div>

    <button type="button" class="auto" id="auto">
      <span class="auto__icon" aria-hidden="true"></span>
      <span data-i18n="hero.auto">RĂZUIEȘTE AUTOMAT</span>
    </button>
  </section>


  <!-- ========================= OPERATORS ========================== -->
  <section class="warn">
    <h2 class="warn__title" data-i18n="warn.title">ALȚI OPERATORI DE PARIURI ȘI CASINO ÎN MOLDOVA</h2>

    <!-- Logo-only cards. The per-operator lead and body copy was dropped from the
         design, so each brand is named via aria-label rather than visible text. -->
    <ul class="ops">
      <li class="op"><span class="op__logo op__logo--1" role="img" aria-label="1XBET"></span></li>
      <li class="op"><span class="op__logo op__logo--2" role="img" aria-label="7777"></span></li>
      <li class="op"><span class="op__logo op__logo--3" role="img" aria-label="GGBET"></span></li>
      <li class="op"><span class="op__logo op__logo--4" role="img" aria-label="bet365"></span></li>
      <li class="op"><span class="op__logo op__logo--5" role="img" aria-label="ICE Casino"></span></li>
      <li class="op"><span class="op__logo op__logo--6" role="img" aria-label="VERDE Casino"></span></li>
    </ul>
  </section>


</main>


<!-- ============================ WIN MODAL ============================ -->
<div class="modal" id="modal" hidden>
  <div class="modal__overlay" data-close></div>

  <div class="modal__card" role="dialog" aria-modal="true" aria-labelledby="modal-heading">
    <button type="button" class="modal__x" id="modal-x" data-close aria-label="Close">&times;</button>

    <h2 class="modal__heading" id="modal-heading" data-i18n="popup.heading">Felicitări! Ai câștigat</h2>

    <div class="modal__prize">
      <strong class="modal__amount" data-i18n="popup.amount">100</strong>
      <span class="modal__currency" data-i18n="popup.currency">Lei Gratis</span>
    </div>

    <p class="modal__timer">
      <span data-i18n="popup.expires">Oferta expiră în:</span>
      <span class="modal__clock">
        <b id="cd-min">57</b><small data-i18n="popup.min">min</small>
        <b id="cd-sec">23</b><small data-i18n="popup.sec">sec</small>
      </span>
    </p>

    <a class="modal__cta" id="modal-cta" href="https://slot.md" target="_blank" rel="noopener"
       data-i18n="popup.cta">Vreau Rotirile</a>
  </div>
</div>

<script src="assets/js/locales.js"></script>
<script src="assets/js/i18n.js"></script>
<script src="assets/js/scratch.js"></script>
<script src="assets/js/main.js"></script>
</body>
</html>
